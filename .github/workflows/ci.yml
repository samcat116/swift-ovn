name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    # The TLS trait is on by default, so `traits: default` is the configuration
    # consumers get; `traits: none` guards the `#if TLS` fallbacks, which
    # nothing else compiles.
    name: "Build and Test (traits: ${{ matrix.traits }})"
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - traits: default
            flags: ""
          - traits: none
            flags: "--disable-default-traits"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: swift build ${{ matrix.flags }}

      # TEMPORARY (remove before merge): the run has hung here for the full job
      # limit with no failure output, and it does not reproduce outside CI. This
      # gives the hang 240s and then reports what it was doing — which tests
      # never finished, and a backtrace of every thread — instead of another six
      # hours of silence.
      - name: Run tests
        run: |
          set -u
          # Output goes to a file, not to this step's stdout. Two reasons: the
          # previous attempt's watchdog never managed to print anything, which
          # points at the Actions log pipe itself being part of the wedge, and
          # a diagnostic that cannot report is no diagnostic. If the run stops
          # hanging purely because of this, that is the answer.
          swift test ${{ matrix.flags }} > /tmp/test.log 2>&1 &
          TEST_PID=$!
          for _ in $(seq 1 48); do
            sleep 5
            kill -0 "$TEST_PID" 2>/dev/null || break
          done

          if ! kill -0 "$TEST_PID" 2>/dev/null; then
            wait "$TEST_PID"
            STATUS=$?
            cat /tmp/test.log
            exit $STATUS
          fi

          # Nothing below writes to stdout until the very end, so a wedged pipe
          # cannot swallow the diagnosis; it lands in the uploaded artifact.
          {
            echo "===== HUNG: no exit after 240s ====="
            grep -o 'Test "[^"]*" started' /tmp/test.log \
              | sed 's/^Test "//; s/" started$//' | sort -u > /tmp/started.txt
            grep -oE 'Test "[^"]*"( with [0-9]+ test cases?)? (passed|failed)' /tmp/test.log \
              | sed -E 's/^Test "//; s/"( with [0-9]+ test cases?)? (passed|failed)$//' | sort -u > /tmp/done.txt
            echo "===== tests started but never finished ====="
            comm -23 /tmp/started.txt /tmp/done.txt
            echo "===== threads ====="
            ps -eLf || true
            # No debugger first: attaching to a wedged process wedged lldb on the
            # previous attempt. The kernel's per-thread view already separates a
            # futex from a blocked write from an idle epoll.
            for pid in $(pgrep -f 'SwiftOVNPackageTests|swiftpm-testing-helper' || true); do
              echo "===== process $pid ====="
              grep -E 'Name|State|Threads' "/proc/$pid/status" 2>/dev/null || true
              for tid in $(ls "/proc/$pid/task" 2>/dev/null); do
                printf '  tid %s  comm=%s  wchan=%s  syscall=%s\n' \
                  "$tid" \
                  "$(cat /proc/$pid/task/$tid/comm 2>/dev/null)" \
                  "$(cat /proc/$pid/task/$tid/wchan 2>/dev/null)" \
                  "$(cut -d' ' -f1 /proc/$pid/task/$tid/syscall 2>/dev/null)"
              done
            done
            for pid in $(pgrep -f 'SwiftOVNPackageTests' || true); do
              echo "===== bounded lldb backtrace of $pid ====="
              timeout 90 lldb -p "$pid" --batch -o 'thread backtrace all' -o detach -o quit 2>&1 | head -800 || echo "(lldb unavailable or timed out)"
            done
          } > /tmp/hang-dump.txt 2>&1

          kill -9 "$TEST_PID" 2>/dev/null || true
          pkill -9 -f 'SwiftOVNPackageTests|swiftpm-testing-helper' 2>/dev/null || true
          cat /tmp/hang-dump.txt || true
          exit 1

      - name: Upload hang dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-dump-${{ matrix.traits }}
          path: |
            /tmp/hang-dump.txt
            /tmp/test.log
          if-no-files-found: ignore
