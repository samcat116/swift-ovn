name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    # The TLS trait is on by default, so `traits: default` is the configuration
    # consumers get; `traits: none` guards the `#if TLS` fallbacks, which
    # nothing else compiles.
    name: Build and Test (traits: ${{ matrix.traits }})
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - traits: default
            flags: ""
          - traits: none
            flags: "--disable-default-traits"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: swift build ${{ matrix.flags }}

      - name: Run tests
        run: swift test ${{ matrix.flags }}
